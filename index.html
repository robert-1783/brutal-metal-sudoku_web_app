<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Brutal Metal Sudoku</title>
  <meta name="description" content="A 6x6 heavy-metal ritual Sudoku game with occult glyphs and Supabase comments overlay." />
  <meta property="og:title" content="Brutal Metal Sudoku" />
  <meta property="og:description" content="A 6x6 heavy-metal ritual Sudoku game with occult glyphs and Supabase comments overlay." />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0a0a0d;
      --panel-bg: #121217;
      --card-bg: #1a1a24;
      --blood-red: #e6194b;
      --ember-orange: #f58231;
      --hell-gold: #ffe119;
      --bone-white: #e8e8ed;
      --iron-gray: #4a4a5a;
      --border-color: #2b2b3b;
      --text-muted: #8e8ea0;
      --font-display: 'Cinzel', 'Trajan Pro', 'Georgia', serif;
      --font-ui: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(230, 25, 75, 0.15), transparent 45%),
        radial-gradient(circle at 80% 90%, rgba(245, 130, 49, 0.08), transparent 40%);
      color: var(--bone-white);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    /* Header Bar */
    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 12px;
    }

    .title-group h1 {
      font-size: 1.25rem;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      font-weight: 900;
      text-shadow: 0 0 12px rgba(230, 25, 75, 0.6);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title-group p {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--bone-white);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-icon:hover, .btn-icon:active {
      background: #252535;
      border-color: var(--blood-red);
      color: #fff;
      box-shadow: 0 0 8px rgba(230, 25, 75, 0.4);
    }

    /* Game Info Bar */
    .ritual-stats {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 14px;
      margin-bottom: 12px;
      font-size: 0.82rem;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .stat-badge strong {
      color: #fff;
    }

    .difficulty-select {
      background: var(--card-bg);
      color: var(--bone-white);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.78rem;
      outline: none;
      cursor: pointer;
    }

    /* 6x6 Sudoku Board */
    .board-container {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 14px;
    }

    #sudoku-grid {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(6, 1fr);
      background: #0d0d12;
      border: 3px solid #4a1521;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), 0 0 20px rgba(230, 25, 75, 0.15);
    }

    /* 2x3 blocks delineation:
       6x6 grid with 2 rows x 3 columns per block:
       Horizontal borders after Row 2 and Row 4.
       Vertical border after Column 3.
    */
    .cell {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #14141d;
      border: 1px solid #232330;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    /* 2x3 Block separators */
    .cell[data-col="2"] {
      border-right: 3px solid #5a1928;
    }
    .cell[data-row="1"], .cell[data-row="3"] {
      border-bottom: 3px solid #5a1928;
    }

    .cell.selected {
      background: #2b1420 !important;
      outline: 2px solid var(--blood-red);
      z-index: 2;
    }

    .cell.highlight-peer {
      background: #1b1926;
    }

    .cell.highlight-symbol {
      background: #2d1822;
    }

    .cell.error {
      background: #4a0d18 !important;
      animation: pulse-error 0.5s infinite alternate;
    }

    .cell.given {
      background: #101017;
    }

    .cell svg {
      width: 68%;
      height: 68%;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
      transition: transform 0.15s ease;
    }

    .cell:active svg {
      transform: scale(0.9);
    }

    .cell .cell-hint {
      position: absolute;
      top: 2px;
      right: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
    }

    @keyframes pulse-error {
      from { box-shadow: inset 0 0 4px var(--blood-red); }
      to { box-shadow: inset 0 0 14px var(--blood-red); }
    }

    /* Symbol Palette & Actions */
    .controls-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .palette-btn {
      aspect-ratio: 1 / 1;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      padding: 4px;
      transition: all 0.15s ease;
    }

    .palette-btn svg {
      width: 65%;
      height: 65%;
      pointer-events: none;
    }

    .palette-btn span.rune-num {
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .palette-btn.active {
      background: #2a121e;
      border-color: var(--blood-red);
      box-shadow: 0 0 12px rgba(230, 25, 75, 0.5);
      transform: translateY(-2px);
    }

    .palette-btn:hover {
      border-color: rgba(230, 25, 75, 0.5);
    }

    /* Ritual Action Buttons (Summon & Banish) */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-action {
      padding: 12px 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }

    .btn-summon {
      background: linear-gradient(135deg, #7a0f26, #b81438);
      color: #fff;
      border-color: var(--blood-red);
      box-shadow: 0 4px 14px rgba(230, 25, 75, 0.35);
    }

    .btn-summon:active {
      transform: scale(0.98);
      box-shadow: 0 0 20px rgba(230, 25, 75, 0.6);
    }

    .btn-banish {
      background: #1e1e28;
      color: #f38ba8;
      border-color: #3b2833;
    }

    .btn-banish:active {
      background: #2e1620;
      transform: scale(0.98);
    }

    .sub-actions {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-top: 2px;
    }

    .btn-secondary {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 7px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
    }

    .btn-secondary:hover {
      color: #fff;
      border-color: var(--iron-gray);
    }

    /* Comments Modal Overlay */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 4, 7, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      max-width: 520px;
      max-height: 88vh;
      background: #13131b;
      border: 1px solid #332431;
      border-top: 2px solid var(--blood-red);
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.open .modal-sheet {
      transform: translateY(0);
    }

    @media (min-width: 600px) {
      .modal-backdrop {
        align-items: center;
        padding: 20px;
      }
      .modal-sheet {
        border-radius: 16px;
        max-height: 80vh;
      }
    }

    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }

    .modal-close:hover {
      color: #fff;
    }

    .modal-content {
      padding: 16px 18px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Comment Form */
    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    .form-group input, .form-group textarea {
      background: #0b0b10;
      border: 1px solid #2d2d3d;
      border-radius: 6px;
      color: #fff;
      padding: 9px 12px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
    }

    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--blood-red);
      box-shadow: 0 0 8px rgba(230, 25, 75, 0.3);
    }

    .btn-submit-comment {
      background: linear-gradient(135deg, #a31536, #cf1b45);
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .btn-submit-comment:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Comments List */
    .comments-feed {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .comment-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--blood-red);
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .comment-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .comment-author {
      font-weight: 700;
      color: #fff;
      font-size: 0.82rem;
    }

    .comment-date {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .comment-text {
      font-size: 0.82rem;
      color: #d1d1dd;
      word-break: break-word;
      line-height: 1.35;
    }

    .db-status-banner {
      font-size: 0.7rem;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed var(--border-color);
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Ritual Completion Modal & Occult Dark Celebration */
    .celebration-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 998;
      display: none;
    }

    .celebration-canvas.active {
      display: block;
    }

    /* Solved Board Consecration Animation */
    #sudoku-grid.ritual-victory {
      animation: ritual-board-glow 2s ease-in-out infinite alternate;
    }

    @keyframes ritual-board-glow {
      0% {
        border-color: #7a1526;
        box-shadow: 0 0 25px rgba(230, 25, 75, 0.45), 0 0 50px rgba(0, 0, 0, 0.95);
      }
      50% {
        border-color: #ff2a55;
        box-shadow: 0 0 50px rgba(230, 25, 75, 0.85), 0 0 80px rgba(245, 130, 49, 0.55);
      }
      100% {
        border-color: #f58231;
        box-shadow: 0 0 35px rgba(255, 225, 25, 0.7), 0 0 65px rgba(230, 25, 75, 0.7);
      }
    }

    .cell.ritual-victory {
      animation: ritual-cell-burn 1.4s ease-in-out infinite alternate;
      animation-delay: calc((var(--r, 0) * 1 + var(--c, 0) * 1) * 75ms);
      z-index: 2;
    }

    @keyframes ritual-cell-burn {
      0% {
        background: #190f17;
        box-shadow: inset 0 0 10px rgba(230, 25, 75, 0.35);
      }
      50% {
        background: #2a111e;
        box-shadow: inset 0 0 22px rgba(245, 130, 49, 0.65), 0 0 15px rgba(230, 25, 75, 0.5);
        border-color: rgba(255, 225, 25, 0.6);
        transform: scale(1.025);
      }
      100% {
        background: #1d0e1a;
        box-shadow: inset 0 0 14px rgba(230, 25, 75, 0.5);
      }
    }

    .cell.ritual-victory svg {
      animation: ritual-glyph-ignite 1.6s ease-in-out infinite alternate;
      animation-delay: calc((var(--r, 0) * 1 + var(--c, 0) * 1) * 75ms);
    }

    @keyframes ritual-glyph-ignite {
      0% {
        filter: drop-shadow(0 0 4px rgba(230, 25, 75, 0.6));
        transform: scale(1);
      }
      50% {
        filter: drop-shadow(0 0 14px rgba(255, 225, 25, 0.95)) drop-shadow(0 0 24px rgba(230, 25, 75, 0.85));
        transform: scale(1.1);
      }
      100% {
        filter: drop-shadow(0 0 8px rgba(245, 130, 49, 0.8));
        transform: scale(1.03);
      }
    }

    .victory-modal {
      position: fixed;
      inset: 0;
      background: rgba(4, 4, 8, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .victory-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .victory-box {
      background: #14141e;
      border: 2px solid var(--blood-red);
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 60px rgba(230, 25, 75, 0.5), 0 20px 50px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transform: scale(0.88) translateY(24px);
      opacity: 0;
      transition: transform 0.45s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.35s ease;
    }

    .victory-modal.open .victory-box {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .victory-seal-icon {
      font-size: 2.8rem;
      animation: victory-flame 1.5s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 15px rgba(245, 130, 49, 0.8));
    }

    @keyframes victory-flame {
      0% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(230, 25, 75, 0.7)); }
      100% { transform: scale(1.12); filter: drop-shadow(0 0 25px rgba(255, 225, 25, 0.95)) drop-shadow(0 0 35px rgba(245, 130, 49, 0.8)); }
    }

    .victory-box h2 {
      color: #fff;
      letter-spacing: 3px;
      font-size: 1.45rem;
      text-transform: uppercase;
      text-shadow: 0 0 15px var(--blood-red), 0 0 30px rgba(230, 25, 75, 0.6);
      margin: 0;
    }

    .victory-box p {
      font-size: 0.9rem;
      color: var(--bone-white);
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="title-group">
      <h1>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10.5" stroke="#ffffff" stroke-width="1.4"/>
          <path d="M12 22 L17.88 3.92 L2.5 15.08 L21.5 15.08 L6.12 3.92 Z" stroke="#ffffff" stroke-width="1.5" fill="rgba(230,25,75,0.2)"/>
        </svg>
        Brutal Sudoku
      </h1>
      <p>6x6 Ritual of the Hexagram</p>
    </div>
    <div class="header-actions">
      <button id="sound-btn" class="btn-icon" title="Toggle Ritual Audio" aria-label="Toggle Audio">
        <span id="sound-icon">🔊</span>
      </button>
      <button id="open-comments-btn" class="btn-icon" title="Supabase Comments" aria-label="Open Comments">
        💬 Ritual Logs
      </button>
    </div>
  </header>

  <!-- Ritual Stats Bar -->
  <div class="ritual-stats">
    <div class="stat-badge">
      <span>Tier:</span>
      <select id="diff-select" class="difficulty-select">
        <option value="easy">Acolyte</option>
        <option value="medium" selected>Doom Priest</option>
        <option value="hard">Arch-Demon</option>
      </select>
    </div>
    <div class="stat-badge">
      <span>Time:</span>
      <strong id="timer-display">00:00</strong>
    </div>
    <div class="stat-badge">
      <span>Sin:</span>
      <strong id="mistakes-display" style="color: var(--blood-red);">0 / 3</strong>
    </div>
  </div>

  <!-- 6x6 Sudoku Grid -->
  <div class="board-container">
    <div id="sudoku-grid"></div>
  </div>

  <!-- Mobile Palette & Ritual Controls -->
  <div class="controls-wrapper">
    <div class="palette" id="glyph-palette">
      <!-- 6 heavy-metal glyph buttons generated via JS -->
    </div>

    <!-- Summon & Banish Primary Actions -->
    <div class="action-grid">
      <button id="summon-btn" class="btn-action btn-summon">
        <span>⚡ SUMMON</span>
      </button>
      <button id="banish-btn" class="btn-action btn-banish">
        <span>⚔️ BANISH</span>
      </button>
    </div>

    <!-- Secondary Helper Controls -->
    <div class="sub-actions">
      <button id="toggle-hint-btn" class="btn-secondary">Decipher Runes (1-6)</button>
      <button id="reset-board-btn" class="btn-secondary">Purge Board</button>
      <button id="new-game-btn" class="btn-secondary">New Rite</button>
    </div>
  </div>

  <!-- Comments Overlay Modal (Supabase Integration) -->
  <div id="comments-modal" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2>
          <span>📜</span> Ritual Inscriptions
        </h2>
        <button id="close-comments-btn" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-content">
        
        <!-- Supabase Status Banner -->
        <div class="db-status-banner">
          <span id="db-status-indicator">⚡ Storage: Initializing...</span>
          <button id="refresh-comments-btn" class="btn-secondary" style="padding: 2px 8px; flex: none;">Refresh</button>
        </div>

        <!-- Submission Form -->
        <form id="comment-form" class="comment-form">
          <div class="form-group">
            <label for="comment-name">Acolyte Name (Accepts pure numbers)</label>
            <input type="text" id="comment-name" placeholder="e.g. 123456 or Slayer" required />
          </div>
          <div class="form-group">
            <label for="comment-text">Inscription / Comment (Accepts pure numbers)</label>
            <textarea id="comment-text" rows="2" placeholder="e.g. 666 or Completed the Arch-Demon rite!" required></textarea>
          </div>
          <button type="submit" id="submit-comment-btn" class="btn-submit-comment">
            <span>Inscribe into Abyss</span>

    function getBlockIndex(row, col) {

    function isValidPlacement(board, row, col, num) {

      const startRow = Math.floor(row / 2) * 2;
      const startCol = Math.floor(col / 3) * 3;
      for (let r = 0; r < 2; r++) {
        for (let c = 0; c < 3; c++) {
          const checkR = startRow + r;
          const checkC = startCol + c;
          if ((checkR !== row || checkC !== col) && board[checkR][checkC] === num) {

          }
        }
      }
      return true;

        if (r === 6) return true;
        const nextR = c === 5 ? r + 1 : r;
        const nextC = c === 5 ? 0 : c + 1;

            board[r][c] = 0;

    function resizeCelebrationCanvas() {
      if (!celebrationCanvas) return;
      const dpr = window.devicePixelRatio || 1;
      celebrationCanvas.width = window.innerWidth * dpr;
      celebrationCanvas.height = window.innerHeight * dpr;
      if (celebrationCtx) {
        if (celebrationCtx.resetTransform) celebrationCtx.resetTransform();
        else celebrationCtx.setTransform(1, 0, 0, 1, 0, 0);
        celebrationCtx.scale(dpr, dpr);
      }
    }

    function startOccultCelebration() {
      if (!celebrationCanvas) initCelebrationCanvas();
      if (!celebrationCanvas || !celebrationCtx) return;

      celebrationActive = true;
      celebrationCanvas.classList.add('active');
      celebrationParticles = [];
      celebrationShockwaves = [];
      celebrationRunes = [];
      celebrationAshes = [];

      resizeCelebrationCanvas();

      // Board coordinates for localized explosive eruption
      const rect = gridElement.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;

      // 1. Consecration Shockwaves emanating from the board
      for (let i = 0; i < 3; i++) {
        celebrationShockwaves.push({
          x: originX,
          y: originY,
          radius: 20 + i * 40,
          maxRadius: Math.max(window.innerWidth, window.innerHeight) * 0.85,
          speed: 7 + i * 2.5,
          color: i % 2 === 0 ? 'rgba(230, 25, 75, ' : 'rgba(245, 130, 49, ',
          opacity: 0.95,
          decay: 0.012
        });
      }

      // 2. High-energy Demonic Sparks erupted radially from the solved board
      const sparkColors = ['#ffffff', '#ffe119', '#f58231', '#ff2a55', '#e6194b'];
      for (let i = 0; i < 90; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 9 + 3;
        celebrationParticles.push({
          x: originX + (Math.random() - 0.5) * (rect.width * 0.6),
          y: originY + (Math.random() - 0.5) * (rect.height * 0.6),
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          drag: 0.965,
          gravity: 0.08,
          size: Math.random() * 3.5 + 1.8,
          color: sparkColors[Math.floor(Math.random() * sparkColors.length)],
          alpha: 1,
          decay: Math.random() * 0.018 + 0.01
        });
      }

      // 3. Ascending Infernal Embers & Sacrificial Cinders
      const emberPalette = ['#ffe119', '#f58231', '#e6194b', '#ff3366', '#d11141'];
      for (let i = 0; i < 95; i++) {
        celebrationParticles.push({
          x: Math.random() * window.innerWidth,
          y: window.innerHeight + Math.random() * 200,
          vx: (Math.random() - 0.5) * 1.4,
          vy: -(Math.random() * 2.6 + 1.2),
          wavePhase: Math.random() * Math.PI * 2,
          waveSpeed: Math.random() * 0.04 + 0.02,
          waveAmp: Math.random() * 1.8 + 0.6,
          size: Math.random() * 3.2 + 1.5,
          color: emberPalette[Math.floor(Math.random() * emberPalette.length)],
          alpha: Math.random() * 0.8 + 0.2,
          isEmber: true
        });
      }

      // 4. Atmospheric Dark Ash & Charcoal Smoke Flakes
      for (let i = 0; i < 45; i++) {
        celebrationAshes.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          vx: (Math.random() - 0.5) * 0.8,
          vy: -(Math.random() * 1.2 + 0.4),
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.03,
          size: Math.random() * 5 + 3,
          alpha: Math.random() * 0.5 + 0.25
        });
      }

      // 5. Floating Occult Micro-Runes
      const runeTypes = ['pentagram', 'cross', 'seal'];
      for (let i = 0; i < 16; i++) {
        celebrationRunes.push({
          x: originX + (Math.random() - 0.5) * (window.innerWidth * 0.75),
          y: originY + (Math.random() - 0.5) * (rect.height * 0.5) + Math.random() * 150,
          vy: -(Math.random() * 1.6 + 0.8),
          vx: (Math.random() - 0.5) * 0.9,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.04,
          type: runeTypes[Math.floor(Math.random() * runeTypes.length)],
          size: Math.random() * 10 + 10,
          color: Math.random() > 0.4 ? 'rgba(255, 255, 255, ' : 'rgba(230, 25, 75, ',
          alpha: 1,
          decay: Math.random() * 0.007 + 0.004
        });
      }

      if (celebrationAnimationId) cancelAnimationFrame(celebrationAnimationId);
      animateCelebration();
    }

    function stopOccultCelebration() {
      celebrationActive = false;
      if (celebrationAnimationId) {
        cancelAnimationFrame(celebrationAnimationId);
        celebrationAnimationId = null;
      }
      if (celebrationCanvas) {
        celebrationCanvas.classList.remove('active');
        if (celebrationCtx) {
          celebrationCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        }
      }
      celebrationParticles = [];
      celebrationShockwaves = [];
      celebrationRunes = [];
      celebrationAshes = [];
      
      const grid = document.getElementById('sudoku-grid');
      if (grid) grid.classList.remove('ritual-victory');
      document.querySelectorAll('.cell.ritual-victory').forEach(c => c.classList.remove('ritual-victory'));
    }

    function animateCelebration() {
      if (!celebrationActive || !celebrationCtx) return;

      const width = window.innerWidth;
      const height = window.innerHeight;
      celebrationCtx.clearRect(0, 0, width, height);

      // Render expanding shockwaves
      for (let i = celebrationShockwaves.length - 1; i >= 0; i--) {
        const sw = celebrationShockwaves[i];
        sw.radius += sw.speed;
        sw.opacity -= sw.decay;

        if (sw.opacity <= 0 || sw.radius >= sw.maxRadius) {
          celebrationShockwaves.splice(i, 1);
          continue;
        }

        celebrationCtx.save();
        celebrationCtx.beginPath();
        celebrationCtx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        celebrationCtx.strokeStyle = sw.color + sw.opacity + ')';
        celebrationCtx.lineWidth = 4;
        celebrationCtx.shadowColor = sw.color + '0.8)';
        celebrationCtx.shadowBlur = 18;
        celebrationCtx.stroke();
        celebrationCtx.restore();
      }

      // Render dark drifting ash flakes
      for (let i = 0; i < celebrationAshes.length; i++) {
        const a = celebrationAshes[i];
        a.x += a.vx;
        a.y += a.vy;
        a.rotation += a.rotSpeed;

        if (a.y < -20) {
          a.y = height + 20;
          a.x = Math.random() * width;
        }

        celebrationCtx.save();
        celebrationCtx.translate(a.x, a.y);
        celebrationCtx.rotate(a.rotation);
        celebrationCtx.fillStyle = `rgba(28, 22, 26, ${a.alpha})`;
        celebrationCtx.fillRect(-a.size / 2, -a.size / 2, a.size, a.size * 0.7);
        celebrationCtx.restore();
      }

      // Render embers & sparks
      for (let i = celebrationParticles.length - 1; i >= 0; i--) {
        const p = celebrationParticles[i];

        if (p.isEmber) {
          p.wavePhase += p.waveSpeed;
          p.x += p.vx + Math.sin(p.wavePhase) * p.waveAmp;
          p.y += p.vy;

          if (p.y < -30) {
            p.y = height + 20;
            p.x = Math.random() * width;
          }

          // Flickering glow
          const flicker = 0.85 + Math.sin(p.wavePhase * 3) * 0.15;
          const currentAlpha = Math.max(0.1, p.alpha * flicker);

          celebrationCtx.save();
          celebrationCtx.shadowColor = p.color;
          celebrationCtx.shadowBlur = 10;
          celebrationCtx.fillStyle = p.color;
          celebrationCtx.globalAlpha = currentAlpha;
          celebrationCtx.beginPath();
          celebrationCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          celebrationCtx.fill();
          celebrationCtx.restore();
        } else {
          // Exploding spark from board center
          p.vx *= p.drag;
          p.vy = p.vy * p.drag + p.gravity;
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            celebrationParticles.splice(i, 1);
            continue;
          }

          celebrationCtx.save();
          celebrationCtx.shadowColor = p.color;
          celebrationCtx.shadowBlur = 8;
          celebrationCtx.fillStyle = p.color;
          celebrationCtx.globalAlpha = Math.max(0, p.alpha);
          celebrationCtx.beginPath();
          celebrationCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          celebrationCtx.fill();
          celebrationCtx.restore();
        }
      }

      // Render floating occult micro-runes
      for (let i = celebrationRunes.length - 1; i >= 0; i--) {
        const r = celebrationRunes[i];
        r.x += r.vx;
        r.y += r.vy;
        r.rotation += r.rotSpeed;
        r.alpha -= r.decay;

        if (r.alpha <= 0 || r.y < -40) {
          celebrationRunes.splice(i, 1);
          continue;
        }

        celebrationCtx.save();
        celebrationCtx.translate(r.x, r.y);
        celebrationCtx.rotate(r.rotation);
        celebrationCtx.strokeStyle = r.color + r.alpha + ')';
        celebrationCtx.lineWidth = 1.6;
        celebrationCtx.shadowColor = r.color + '0.8)';
        celebrationCtx.shadowBlur = 9;

        const s = r.size;
        if (r.type === 'pentagram') {
          // Inverted pentagram vector
          celebrationCtx.beginPath();
          celebrationCtx.arc(0, 0, s * 0.9, 0, Math.PI * 2);
          celebrationCtx.stroke();
          celebrationCtx.beginPath();
          for (let k = 0; k < 5; k++) {
            const angle = (k * 4 * Math.PI) / 5 + Math.PI / 2;
            const px = Math.cos(angle) * s * 0.85;
            const py = Math.sin(angle) * s * 0.85;
            if (k === 0) celebrationCtx.moveTo(px, py);
            else celebrationCtx.lineTo(px, py);
          }
          celebrationCtx.closePath();
          celebrationCtx.stroke();
        } else if (r.type === 'cross') {
          // Inverted cross
          celebrationCtx.beginPath();
          celebrationCtx.moveTo(0, -s);
          celebrationCtx.lineTo(0, s);
          celebrationCtx.moveTo(-s * 0.6, s * 0.4);
          celebrationCtx.lineTo(s * 0.6, s * 0.4);
          celebrationCtx.stroke();
        } else {
          // Runic seal triangle
          celebrationCtx.beginPath();
          celebrationCtx.moveTo(0, -s);
          celebrationCtx.lineTo(s * 0.8, s * 0.7);
          celebrationCtx.lineTo(-s * 0.8, s * 0.7);
          celebrationCtx.closePath();
          celebrationCtx.stroke();
        }
        celebrationCtx.restore();
      }

      // Subtle dark atmospheric edge vignette
      const vigGrad = celebrationCtx.createRadialGradient(
        width / 2, height / 2, Math.min(width, height) * 0.4,
        width / 2, height / 2, Math.max(width, height) * 0.85
      );
      vigGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
      vigGrad.addColorStop(1, 'rgba(4, 2, 4, 0.48)');
      celebrationCtx.fillStyle = vigGrad;
      celebrationCtx.fillRect(0, 0, width, height);

      celebrationAnimationId = requestAnimationFrame(animateCelebration);
    }

    /* =========================================================================
       4. GAME INITIALIZATION & BOARD RENDERING
       ========================================================================= */
    const gridElement = document.getElementById('sudoku-grid');
    const paletteElement = document.getElementById('glyph-palette');
    const timerDisplay = document.getElementById('timer-display');
    const mistakesDisplay = document.getElementById('mistakes-display');
    const diffSelect = document.getElementById('diff-select');

    function initGame(diff = 'medium') {
      currentDifficulty = diff;
      diffSelect.value = diff;

      // Stop previous celebration if active
      isBoardSolved = false;
      stopOccultCelebration();
      document.getElementById('victory-modal').classList.remove('open');
      gridElement.classList.remove('ritual-victory');

      // Rigorously generate and test the puzzle using pure deductive logic before displaying
      const puzzle = createPureLogicPuzzle(diff);

      currentBoard = puzzle.clues.map(row => [...row]);
      initialClues = puzzle.clues.map(row => [...row]);
      solutionBoard = puzzle.solution.map(row => [...row]);

      selectedCell = { row: null, col: null };
      mistakes = 0;
      gameActive = true;
      updateMistakesUI();

      clearInterval(timerInterval);
      timerSeconds = 0;
      updateTimerUI();
      timerInterval = setInterval(() => {
        if (gameActive) {
          timerSeconds++;
          updateTimerUI();
        }
      }, 1000);

      renderBoard();
      renderPalette();
    }

    function updateTimerUI() {
      const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const secs = String(timerSeconds % 60).padStart(2, '0');
      timerDisplay.textContent = `${mins}:${secs}`;
    }

    function updateMistakesUI() {
      mistakesDisplay.textContent = `${mistakes} / 3`;
      if (mistakes >= 3) {
        mistakesDisplay.style.color = '#ff0033';
      } else {
        mistakesDisplay.style.color = 'var(--blood-red)';
      }
    }

    function renderBoard() {
      gridElement.innerHTML = '';
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          const val = currentBoard[r][c];
          const isGiven = initialClues[r][c] !== 0;
          const isSelected = selectedCell.row === r && selectedCell.col === c;

          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.style.setProperty('--r', r);
          cell.style.setProperty('--c', c);

          if (isGiven) cell.classList.add('given');
          if (isSelected) cell.classList.add('selected');
          if (isBoardSolved) cell.classList.add('ritual-victory');

          // Highlight row/column/block peers
          if (selectedCell.row !== null) {
            const isPeer = (selectedCell.row === r || selectedCell.col === c ||
                           getBlockIndex(selectedCell.row, selectedCell.col) === getBlockIndex(r, c));
            if (isPeer && !isSelected) {
              cell.classList.add('highlight-peer');
            }
            // Highlight identical symbols
            const selectedVal = currentBoard[selectedCell.row][selectedCell.col];
            if (selectedVal !== 0 && val === selectedVal && !isSelected) {
              cell.classList.add('highlight-symbol');
            }
          }

          // Check error
          if (val !== 0 && !isGiven && val !== solutionBoard[r][c]) {
            cell.classList.add('error');
          }

          if (val !== 0 && GLYPHS[val]) {
            cell.innerHTML = GLYPHS[val].svg;
            if (showNumericHints) {
              const hint = document.createElement('span');
              hint.className = 'cell-hint';
              hint.textContent = val;
              cell.appendChild(hint);
            }
          }

          cell.addEventListener('click', () => onCellClicked(r, c));
          gridElement.appendChild(cell);
        }
      }
    }

    function renderPalette() {
      paletteElement.innerHTML = '';
      for (let i = 1; i <= 6; i++) {
        const item = GLYPHS[i];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'palette-btn';
        if (selectedPaletteSymbol === i) {
          btn.classList.add('active');
        }
        btn.innerHTML = `
          ${item.svg}
          <span class="rune-num">${showNumericHints ? i : ''}</span>
        `;
        btn.title = `${item.name} (${i})`;
        btn.addEventListener('click', () => {
          selectedPaletteSymbol = i;
          renderPalette();
          // If a cell is currently selected, directly summon into it!
          if (selectedCell.row !== null && selectedCell.col !== null) {
            summonSymbol(i);
          }
        });
        paletteElement.appendChild(btn);
      }
    }

    function onCellClicked(row, col) {
      initAudio();
      if (selectedCell.row === row && selectedCell.col === col) {
        // Double tap: place current symbol if empty, or keep selected
      }
      selectedCell = { row, col };
      renderBoard();
    }

    function summonSymbol(symbolVal = selectedPaletteSymbol) {
      if (!gameActive) return;
      if (selectedCell.row === null || selectedCell.col === null) return;
      const { row, col } = selectedCell;

      // Cannot overwrite given clues
      if (initialClues[row][col] !== 0) {
        playErrorSound();
        return;
      }

      currentBoard[row][col] = symbolVal;

      // Check if valid
      if (symbolVal === solutionBoard[row][col]) {
        playSummonSound();
      } else {
        playErrorSound();
        mistakes++;
        updateMistakesUI();
        if (mistakes >= 3) {
          // Warning on 3 blasphemies
        }
      }

      renderBoard();
      checkVictory();
    }

    function banishSymbol() {
      if (!gameActive) return;
      if (selectedCell.row === null || selectedCell.col === null) return;
      const { row, col } = selectedCell;

      if (initialClues[row][col] !== 0) {
        playErrorSound();
        return;
      }

      if (currentBoard[row][col] !== 0) {
        currentBoard[row][col] = 0;
        playBanishSound();
        renderBoard();
      }
    }

    function checkVictory() {
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          if (currentBoard[r][c] !== solutionBoard[r][c]) {
            return false;
          }
        }
      }

      // Solved!
      gameActive = false;
      isBoardSolved = true;
      clearInterval(timerInterval);

      // Deselect any active cell and re-render board with ritual-victory styles
      selectedCell = { row: null, col: null };
      renderBoard();
      gridElement.classList.add('ritual-victory');

      // Play multi-layered heavy-metal celebration power-chords
      playVictoryFanfare();

      // Launch the dark-themed ritual canvas particles (embers, sparks, shockwaves, runes)
      startOccultCelebration();

      // Stagger modal reveal so player enjoys the board igniting before the modal overlays
      setTimeout(() => {
        if (isBoardSolved) {
          document.getElementById('final-time').textContent = timerDisplay.textContent;
          document.getElementById('victory-modal').classList.add('open');
        }
      }, 700);

      return true;
    }

    /* =========================================================================
       5. SUPABASE COMMENTS OVERLAY INTEGRATION
       - Connects via @supabase/supabase-js (or raw fetch requests fallback)
       - Reads from and inserts into public.comments
       - Pure numbers (e.g. '123456') are handled safely without error
       - Automatically clears form upon successful submission
       - Placeholders for SUPABASE_URL and SUPABASE_KEY
       ========================================================================= */
    let supabaseClient = null;
    let localMockComments = [
      { id: 1, author: 'Behemoth', content: 'The 6x6 hexagram is brutally satisfying.', created_at: new Date(Date.now() - 3600000).toISOString() },
      { id: 2, author: '666', content: '123456', created_at: new Date(Date.now() - 7200000).toISOString() }
    ];

    function initSupabase() {
      const isPlaceholder = !SUPABASE_URL || SUPABASE_URL === 'YOUR_SUPABASE_URL' || !SUPABASE_KEY || SUPABASE_KEY === 'YOUR_SUPABASE_KEY';
      const statusIndicator = document.getElementById('db-status-indicator');

      if (!isPlaceholder && window.supabase && typeof window.supabase.createClient === 'function') {
        try {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          statusIndicator.textContent = '⚡ Connected to Supabase';
          statusIndicator.style.color = '#4ade80';
          return;
        } catch (err) {
          console.warn('Supabase client init failed, using fallback:', err);
        }
      }

      statusIndicator.textContent = '⚡ Ritual Cache (Configure SUPABASE_URL/KEY for Cloud)';
      statusIndicator.style.color = 'var(--ember-orange)';
    }

    async function fetchComments() {
      const listElement = document.getElementById('comments-list');
      const countElement = document.getElementById('comments-count');
      listElement.innerHTML = '<div style="color:var(--text-muted); font-size:0.8rem; padding:8px 0;">Consulting the Abyss...</div>';

      const isPlaceholder = !SUPABASE_URL || SUPABASE_URL === 'YOUR_SUPABASE_URL';

      if (!isPlaceholder && supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('comments')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(30);

          if (!error && Array.isArray(data)) {
            renderCommentsList(data);
            return;
          }
        } catch (e) {
          console.warn('Supabase query error, falling back to local/raw:', e);
        }
      }

      // Raw REST fetch fallback if client isn't available
      if (!isPlaceholder && SUPABASE_URL && SUPABASE_KEY) {
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/comments?select=*&order=created_at.desc&limit=30`, {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            }
          });
          if (res.ok) {
            const data = await res.json();
            renderCommentsList(data);
            return;
          }
        } catch (e) {
          console.warn('Raw fetch error:', e);
        }
      }

      // Local mock fallback
      renderCommentsList(localMockComments);
    }

    function renderCommentsList(comments) {
      const listElement = document.getElementById('comments-list');
      const countElement = document.getElementById('comments-count');
      listElement.innerHTML = '';
      countElement.textContent = `${comments.length} inscriptions`;

      if (comments.length === 0) {
        listElement.innerHTML = '<div style="color:var(--text-muted); font-size:0.8rem; padding:12px; text-align:center;">No inscriptions yet. Be the first to seal the pact.</div>';
        return;
      }

      comments.forEach(item => {
        const card = document.createElement('div');
        card.className = 'comment-card';

        // Support both schema variations (author/content as well as name/comment)
        const rawAuthor = item.author !== undefined && item.author !== null ? item.author : item.name;
        const rawContent = item.content !== undefined && item.content !== null ? item.content : item.comment;

        const authorStr = String(rawAuthor !== undefined && rawAuthor !== null ? rawAuthor : 'Unknown Cultist');
        const textStr = String(rawContent !== undefined && rawContent !== null ? rawContent : '');
        const dateStr = item.created_at ? new Date(item.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' }) : 'Recently';

        card.innerHTML = `
          <div class="comment-card-top">
            <span class="comment-author">⚔️ ${escapeHtml(authorStr)}</span>
            <span class="comment-date">${dateStr}</span>
          </div>
          <div class="comment-text">${escapeHtml(textStr)}</div>
        `;
        listElement.appendChild(card);
      });
    }

    async function submitComment(nameInputVal, commentInputVal) {
      // Must accept pure numbers (like '123456') without failing!
      const safeName = String(nameInputVal !== undefined && nameInputVal !== null ? nameInputVal : '').trim();
      const safeComment = String(commentInputVal !== undefined && commentInputVal !== null ? commentInputVal : '').trim();

      if (!safeName || !safeComment) {
        alert('Both Name and Inscription are required.');
        return false;
      }

      const submitBtn = document.getElementById('submit-comment-btn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Sealing...</span>';

      let success = false;
      const isPlaceholder = !SUPABASE_URL || SUPABASE_URL === 'YOUR_SUPABASE_URL';

      // 1. Try Supabase Client (try author/content matching database schema first, then fallback to name/comment)
      if (!isPlaceholder && supabaseClient) {
        try {
          const { error } = await supabaseClient
            .from('comments')
            .insert([{ author: safeName, content: safeComment }]);

          if (!error) {
            success = true;
          } else {
            console.warn('Supabase insert with author/content error, attempting fallback:', error);
            const { error: fallbackErr } = await supabaseClient
              .from('comments')
              .insert([{ name: safeName, comment: safeComment }]);
            if (!fallbackErr) {
              success = true;
            }
          }
        } catch (e) {
          console.warn('Supabase client insert exception:', e);
        }
      }

      // 2. Try Raw Fetch if client failed or isn't active
      if (!success && !isPlaceholder && SUPABASE_URL && SUPABASE_KEY) {
        try {
          let res = await fetch(`${SUPABASE_URL}/rest/v1/comments`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'Prefer': 'return=representation'
            },
            body: JSON.stringify({ author: safeName, content: safeComment })
          });
          if (res.ok) {
            success = true;
          } else {
            // Fallback attempt with name/comment
            res = await fetch(`${SUPABASE_URL}/rest/v1/comments`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Prefer': 'return=representation'
              },
              body: JSON.stringify({ name: safeName, comment: safeComment })
            });
            if (res.ok) {
              success = true;
            }
          }
        } catch (e) {
          console.warn('Raw fetch insert failed:', e);
        }
      }

      // 3. Fallback to Local Ledger so user experience is always fluid
      if (!success) {
        const newEntry = {
          id: Date.now(),
          author: safeName,
          content: safeComment,
          created_at: new Date().toISOString()
        };
        localMockComments.unshift(newEntry);
        success = true;
      }

      submitBtn.disabled = false;
      submitBtn.innerHTML = '<span>Inscribe into Abyss</span>';

      if (success) {
        // Automatically clear inputs upon successful submission as required!
        document.getElementById('comment-name').value = '';
        document.getElementById('comment-text').value = '';
        fetchComments();
        playSummonSound();
      }

      return success;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    /* =========================================================================
       6. EVENT LISTENERS & WIRING
       ========================================================================= */
    document.addEventListener('DOMContentLoaded', () => {
      initGame('medium');
      initSupabase();

      // Palette Summon & Banish
      document.getElementById('summon-btn').addEventListener('click', () => {
        initAudio();
        summonSymbol(selectedPaletteSymbol);
      });

      document.getElementById('banish-btn').addEventListener('click', () => {
        initAudio();
        banishSymbol();
      });

      // Sound Toggle
      const soundBtn = document.getElementById('sound-btn');
      const soundIcon = document.getElementById('sound-icon');
      soundBtn.addEventListener('click', () => {
        initAudio();
        soundEnabled = !soundEnabled;
        soundIcon.textContent = soundEnabled ? '🔊' : '🔇';
      });

      // Decipher / Numeric Hint Toggle
      document.getElementById('toggle-hint-btn').addEventListener('click', () => {
        showNumericHints = !showNumericHints;
        renderBoard();
        renderPalette();
      });

      // Reset Board
      document.getElementById('reset-board-btn').addEventListener('click', () => {
        if (confirm('Purge all unsealed summonings on this board?')) {
          isBoardSolved = false;
          stopOccultCelebration();
          gridElement.classList.remove('ritual-victory');
          currentBoard = initialClues.map(row => [...row]);
          renderBoard();
          playBanishSound();
        }
      });

      // New Game
      document.getElementById('new-game-btn').addEventListener('click', () => {
        initGame(currentDifficulty);
      });

      // Difficulty Change
      diffSelect.addEventListener('change', (e) => {
        initGame(e.target.value);
      });

      // Keyboard Controls for Desktop & Tablets
      window.addEventListener('keydown', (e) => {
        // Ignore if typing inside comment modal
        if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) {
          return;
        }

        const key = e.key;
        if (key >= '1' && key <= '6') {
          const num = parseInt(key, 10);
          selectedPaletteSymbol = num;
          renderPalette();
          summonSymbol(num);
        } else if (key === 'Backspace' || key === 'Delete' || key === 'x' || key === 'X' || key === '0') {
          banishSymbol();
        } else if (key === 'ArrowUp' && selectedCell.row > 0) {
          selectedCell.row--;
          renderBoard();
        } else if (key === 'ArrowDown' && selectedCell.row < 5) {
          selectedCell.row++;
          renderBoard();
        } else if (key === 'ArrowLeft' && selectedCell.col > 0) {
          selectedCell.col--;
          renderBoard();
        } else if (key === 'ArrowRight' && selectedCell.col < 5) {
          selectedCell.col++;
          renderBoard();
        }
      });

      // Comments Modal Controls
      const commentsModal = document.getElementById('comments-modal');
      const openCommentsBtn = document.getElementById('open-comments-btn');
      const closeCommentsBtn = document.getElementById('close-comments-btn');

      openCommentsBtn.addEventListener('click', () => {
        commentsModal.classList.add('open');
        fetchComments();
      });

      closeCommentsBtn.addEventListener('click', () => {
        commentsModal.classList.remove('open');
      });

      commentsModal.addEventListener('click', (e) => {
        if (e.target === commentsModal) {
          commentsModal.classList.remove('open');
        }
      });

      document.getElementById('refresh-comments-btn').addEventListener('click', () => {
        fetchComments();
      });

      // Comment Form Submission
      const commentForm = document.getElementById('comment-form');
      commentForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const nameVal = document.getElementById('comment-name').value;
        const textVal = document.getElementById('comment-text').value;
        await submitComment(nameVal, textVal);
      });

      // Victory Modal Actions
      document.getElementById('victory-again-btn').addEventListener('click', () => {
        document.getElementById('victory-modal').classList.remove('open');
        initGame(currentDifficulty);
      });

      document.getElementById('victory-share-btn').addEventListener('click', () => {
        document.getElementById('victory-modal').classList.remove('open');
        commentsModal.classList.add('open');
        document.getElementById('comment-text').value = `I sealed the ${currentDifficulty.toUpperCase()} Hexagram in ${timerDisplay.textContent}!`;
        fetchComments();
      });
    });
  </script>
</body>
</html>
